name: Flutter & Native Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project (kosongkan untuk build repo ini)'
        required: false
        type: string
      tag:
        description: 'Tag release'
        required: false
        default: 'latest'
        type: string
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set build dir
        run: |
          BUILD_DIR="${GITHUB_WORKSPACE}/build_${{ github.run_id }}"
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          mkdir -p "${BUILD_DIR}"

      - name: Checkout repo
        if: github.event_name == 'push' || github.event.inputs.zip_url == ''
        uses: actions/checkout@v4

      - name: Copy repo ke build dir
        if: github.event_name == 'push' || github.event.inputs.zip_url == ''
        run: |
          cp -r "${GITHUB_WORKSPACE}/." "${BUILD_DIR}/project/"
          echo "BUILD_SOURCE=repo" >> $GITHUB_ENV

      - name: Download project ZIP
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.zip_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "${BUILD_DIR}/project.zip" \
            "${{ github.event.inputs.zip_url }}"

          unzip -q "${BUILD_DIR}/project.zip" -d "${BUILD_DIR}/project_raw"

          # Flatten satu level subfolder jika ada
          RAW="${BUILD_DIR}/project_raw"
          ITEMS=$(ls -A "$RAW" | wc -l)
          FIRST=$(ls -A "$RAW" | head -1)
          if [ "$ITEMS" -eq 1 ] && [ -d "$RAW/$FIRST" ]; then
            mv "$RAW/$FIRST" "${BUILD_DIR}/project"
          else
            mv "$RAW" "${BUILD_DIR}/project"
          fi
          echo "BUILD_SOURCE=zip" >> $GITHUB_ENV

      # ── Detect project type ───────────────────────────────────────────────
      - name: Detect project type & normalize root
        run: |
          PROJECT="${BUILD_DIR}/project"

          echo "=== Isi project ==="
          find "$PROJECT" -type f | sort

          # ── SyncXxX: generate_icons.py di root, android/ berisi native project
          if [ -f "$PROJECT/generate_icons.py" ]; then
            echo "PROJECT_TYPE=syncxxx" >> $GITHUB_ENV
            echo "✅ Detected: SyncXxX"

          # ── SyncXxX nested: zip langsung berisi subfolder yg punya generate_icons.py
          elif find "$PROJECT" -maxdepth 2 -name "generate_icons.py" | grep -q .; then
            ICONS_PATH=$(find "$PROJECT" -maxdepth 2 -name "generate_icons.py" | head -1)
            ICONS_DIR=$(dirname "$ICONS_PATH")
            if [ "$ICONS_DIR" != "$PROJECT" ]; then
              shopt -s dotglob
              mv "$ICONS_DIR"/* "$PROJECT/" 2>/dev/null || true
              shopt -u dotglob
            fi
            echo "PROJECT_TYPE=syncxxx" >> $GITHUB_ENV
            echo "✅ Detected: SyncXxX (nested, normalized)"

          # ── Flutter: ada pubspec.yaml
          else
            PUBSPEC=$(find "$PROJECT" -name "pubspec.yaml" 2>/dev/null | head -1)
            if [ -n "$PUBSPEC" ]; then
              echo "PROJECT_TYPE=flutter" >> $GITHUB_ENV
              echo "✅ Detected: Flutter"
              ROOT=$(dirname "$PUBSPEC")
              if [ "$ROOT" != "$PROJECT" ]; then
                shopt -s dotglob
                mv "$ROOT"/* "$PROJECT/" 2>/dev/null || true
                shopt -u dotglob
              fi

            # ── Native Android: ada settings.gradle
            else
              SETTINGS=$(find "$PROJECT" \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                2>/dev/null | head -1)

              if [ -n "$SETTINGS" ]; then
                echo "PROJECT_TYPE=native" >> $GITHUB_ENV
                echo "✅ Detected: Native Android — $SETTINGS"
                ROOT=$(dirname "$SETTINGS")
                if [ "$ROOT" != "$PROJECT" ]; then
                  shopt -s dotglob
                  mv "$ROOT"/* "$PROJECT/" 2>/dev/null || true
                  shopt -u dotglob
                fi
              else
                echo "PROJECT_TYPE=native" >> $GITHUB_ENV
                echo "⚠️ Fallback Native"
              fi
            fi
          fi

      # ── SyncXxX ───────────────────────────────────────────────────────────
      - name: Setup Python
        if: env.PROJECT_TYPE == 'syncxxx'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: pip install Pillow

      - name: Generate App Icons
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: python3 generate_icons.py

      - name: Setup Gradle Wrapper (SyncXxX)
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          GRADLE_VERSION="8.4"
          GRADLE_BIN="/opt/gradle-${GRADLE_VERSION}/bin/gradle"

          # Install gradle binary jika belum ada
          if [ ! -f "$GRADLE_BIN" ]; then
            curl -fsSL \
              -o /tmp/gradle-bin.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle-bin.zip -d /opt
          fi

          # Generate gradlew + gradle-wrapper.jar yang valid
          mkdir -p android/gradle/wrapper
          "$GRADLE_BIN" wrapper \
            --project-dir android \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x android/gradlew

          # Validasi class ada
          unzip -p android/gradle/wrapper/gradle-wrapper.jar \
            org/gradle/wrapper/GradleWrapperMain.class > /dev/null
          echo "✅ GradleWrapperMain verified"
          ls -lh android/gradle/wrapper/

      # ── Flutter ───────────────────────────────────────────────────────────
      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Get Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          sed -i 's/flutter_lints:.*$/flutter_lints: ^4.0.0/' pubspec.yaml
          flutter pub get || flutter pub upgrade --major-versions

      - name: Fix pub-cache build.gradle
        if: env.PROJECT_TYPE == 'flutter'
        run: |
          find ~/.pub-cache -name "build.gradle" \
            | xargs grep -l "flutter\.\(compileSdkVersion\|targetSdkVersion\|minSdkVersion\)" 2>/dev/null \
            | while read FILE; do
              sed -i 's/flutter\.compileSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.targetSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.minSdkVersion/21/g' "$FILE"
            done

      - name: Fix project minSdk (Flutter)
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          for GRADLE in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$GRADLE" ] || continue
            sed -i 's/minSdkVersion[[:space:]]*flutter\.minSdkVersion/minSdkVersion 24/g' "$GRADLE"
            sed -i 's/minSdkVersion[[:space:]]*[0-9]\+/minSdkVersion 24/g' "$GRADLE"
            sed -i 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' "$GRADLE"
            sed -i 's/minSdk[[:space:]]*=[[:space:]]*[0-9]\+/minSdk = 24/g' "$GRADLE"
            sed -i 's/versionCode[[:space:]]*=[[:space:]]*flutter\.versionCode/versionCode = 1/g' "$GRADLE"
            sed -i 's/versionName[[:space:]]*=[[:space:]]*flutter\.versionName/versionName = "1.0"/g' "$GRADLE"
            echo "Patched: $GRADLE"
          done

      # ── NDK & CMake (Native + SyncXxX) ───────────────────────────────────
      - name: Setup NDK & CMake
        if: env.PROJECT_TYPE == 'native' || env.PROJECT_TYPE == 'syncxxx'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}" -name "sdkmanager" | head -1)
          fi
          echo "y" | "$SDKMANAGER" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Patch Native build.gradle
        if: env.PROJECT_TYPE == 'native' || env.PROJECT_TYPE == 'syncxxx'
        run: |
          GRADLE_ROOT="${BUILD_DIR}/project"
          [ "${{ env.PROJECT_TYPE }}" = "syncxxx" ] && GRADLE_ROOT="${BUILD_DIR}/project/android"
          find "$GRADLE_ROOT" \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            | while read G; do
              sed -i 's/compileSdkVersion[[:space:]]*[0-9]\+/compileSdkVersion 34/g' "$G"
              sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 34/g' "$G"
              sed -i 's/targetSdkVersion[[:space:]]*[0-9]\+/targetSdkVersion 34/g' "$G"
              sed -i 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]\+/targetSdk = 34/g' "$G"
              sed -i 's/minSdkVersion[[:space:]]*[0-9]\+/minSdkVersion 24/g' "$G"
              sed -i 's/minSdk[[:space:]]*=[[:space:]]*[0-9]\+/minSdk = 24/g' "$G"
            done

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build SyncXxX APK
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project/android
        run: |
          # Build selalu debug dulu untuk capture error — release di run berikutnya
          BUILD_TASK="assembleDebug"
          [ "${{ github.event.inputs.build_type }}" = "release" ] && BUILD_TASK="assembleRelease"

          set +e
          ./gradlew "$BUILD_TASK" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -Pkotlin.daemon.jvm.options="-Xmx2g" \
            > /tmp/build-stdout.log 2> /tmp/build-stderr.log
          EXIT=$?
          set -e

          echo "===== STDOUT (last 200) ====="
          tail -200 /tmp/build-stdout.log || true

          echo "===== STDERR (all) ====="
          cat /tmp/build-stderr.log || true

          echo "===== KOTLIN BUILD REPORTS ====="
          find . -name "*.log" -path "*/kotlin-build*" 2>/dev/null \
            | while read f; do echo "=== $f ==="; cat "$f"; done || true

          echo "===== KOTLIN COMPILE OUTPUT FILES ====="
          find . \( \
            -path "*/build/tmp/kotlin-classes*" \
            -o -path "*/build/kotlin*" \
            -o -path "*/reports/kotlin*" \
          \) -name "*.txt" -o -name "*.log" 2>/dev/null \
            | while read f; do echo "=== $f ==="; cat "$f"; done || true

          echo "===== ALL BUILD FILES ====="
          find ./app/build -type f 2>/dev/null | sort | head -50 || true

          exit "$EXIT"

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Build Native APK
        if: env.PROJECT_TYPE == 'native'
        run: |
          PROJECT="${BUILD_DIR}/project"
          GRADLE_VERSION="8.4"
          GRADLE_BIN="/opt/gradle-${GRADLE_VERSION}/bin/gradle"

          if [ ! -f "$GRADLE_BIN" ]; then
            curl -fsSL -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d /opt
          fi

          cd "$PROJECT"

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            APP_NAME=$(basename "$PROJECT")
            printf 'rootProject.name = "%s"\ninclude(":app")\n' "$APP_NAME" > settings.gradle
          fi

          if [ ! -f "gradlew" ]; then
            "$GRADLE_BIN" wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin
            chmod +x gradlew
          fi

          # Pastikan wrapper jar ada — generate via gradle binary
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            "$GRADLE_BIN" wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin
          fi
          chmod +x gradlew

          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # ── Collect & upload ──────────────────────────────────────────────────
      - name: Collect APKs
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="latest"
          OUT="${BUILD_DIR}/output"
          mkdir -p "$OUT"
          FOUND=0

          if [ "${{ env.PROJECT_TYPE }}" = "syncxxx" ]; then
            APK=$(find "${BUILD_DIR}/project/android/app/build/outputs/apk" \
              -name "*.apk" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" "$OUT/SyncXxX.apk"
              echo "Collected: SyncXxX.apk"
              FOUND=1
            fi
          else
            while IFS= read -r APK; do
              [ -f "$APK" ] || continue
              BASENAME=$(basename "$APK" .apk)
              cp "$APK" "$OUT/${BASENAME}-${TAG}.apk"
              echo "Collected: ${BASENAME}-${TAG}.apk"
              FOUND=1
            done < <(find "${BUILD_DIR}/project" -name "*.apk" 2>/dev/null)
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "❌ Tidak ada APK. Isi build dir:"
            find "${BUILD_DIR}/project" -type f | head -50
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag || 'latest' }}-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/output/*.apk
          if-no-files-found: error
          retention-days: 30
