# .github/workflows/build.yml
name: Flutter & Native Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project (kosongkan untuk build repo ini)'
        required: false
        type: string
      tag:
        description: 'Tag release'
        required: false
        default: 'latest'
        type: string
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set build dir
        run: |
          BUILD_DIR="${GITHUB_WORKSPACE}/build_${{ github.run_id }}"
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          mkdir -p "${BUILD_DIR}"

      # ── Mode: repo sendiri ─────────────────────────────────────────────────
      - name: Checkout repo
        if: github.event_name == 'push' || github.event.inputs.zip_url == ''
        uses: actions/checkout@v4

      - name: Copy repo ke build dir
        if: github.event_name == 'push' || github.event.inputs.zip_url == ''
        run: |
          cp -r "${GITHUB_WORKSPACE}/." "${BUILD_DIR}/project/"
          echo "BUILD_SOURCE=repo" >> $GITHUB_ENV

      # ── Mode: ZIP external ─────────────────────────────────────────────────
      - name: Download project ZIP
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.zip_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "${BUILD_DIR}/project.zip" \
            "${{ github.event.inputs.zip_url }}"

          unzip -q "${BUILD_DIR}/project.zip" -d "${BUILD_DIR}/project"
          echo "BUILD_SOURCE=zip" >> $GITHUB_ENV

      # ── Detect project type ────────────────────────────────────────────────
      - name: Detect project type & normalize root
        run: |
          PROJECT="${BUILD_DIR}/project"

          echo "=== Isi ZIP (semua file) ==="
          find "$PROJECT" -type f | sort

          # SyncXxX
          if [ -f "$PROJECT/generate_icons.py" ]; then
            echo "PROJECT_TYPE=syncxxx" >> $GITHUB_ENV
            echo "✅ Detected: SyncXxX"

          else
            # Flutter
            PUBSPEC=$(find "$PROJECT" -name "pubspec.yaml" 2>/dev/null | head -1)
            if [ -n "$PUBSPEC" ]; then
              echo "PROJECT_TYPE=flutter" >> $GITHUB_ENV
              echo "✅ Detected: Flutter — $PUBSPEC"
              ROOT=$(dirname "$PUBSPEC")
              if [ "$ROOT" != "$PROJECT" ]; then
                shopt -s dotglob
                mv "$ROOT"/* "$PROJECT/" 2>/dev/null || true
                shopt -u dotglob
              fi

            else
              # Native — cari settings.gradle ATAU gradlew
              SETTINGS=$(find "$PROJECT" \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                2>/dev/null | head -1)

              GRADLEW=$(find "$PROJECT" -name "gradlew" 2>/dev/null | head -1)

              MARKER="${SETTINGS:-$GRADLEW}"
              echo "=== Native marker: $MARKER ==="

              if [ -n "$MARKER" ]; then
                echo "PROJECT_TYPE=native" >> $GITHUB_ENV
                echo "✅ Detected: Native Android"
              else
                echo "❌ Tidak ditemukan pubspec.yaml / settings.gradle / gradlew"
                find "$PROJECT" -type f | sort
                exit 1
              fi
            fi
          fi

      # ── SyncXxX setup ──────────────────────────────────────────────────────
      - name: Setup Python
        if: env.PROJECT_TYPE == 'syncxxx'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: pip install Pillow

      - name: Generate App Icons
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: python3 generate_icons.py

      - name: Setup Gradle Wrapper (SyncXxX)
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew

      # ── Flutter setup ──────────────────────────────────────────────────────
      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Get Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          sed -i 's/flutter_lints:.*$/flutter_lints: ^4.0.0/' pubspec.yaml
          flutter pub get || flutter pub upgrade --major-versions

      - name: Fix pub-cache build.gradle
        if: env.PROJECT_TYPE == 'flutter'
        run: |
          find ~/.pub-cache -name "build.gradle" \
            | xargs grep -l "flutter\.\(compileSdkVersion\|targetSdkVersion\|minSdkVersion\)" 2>/dev/null \
            | while read FILE; do
              sed -i 's/flutter\.compileSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.targetSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.minSdkVersion/21/g' "$FILE"
              echo "Patched: $FILE"
            done

      - name: Fix project minSdk (Flutter)
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          for GRADLE in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$GRADLE" ] || continue
            sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 24/g' "$GRADLE"
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/g' "$GRADLE"
            sed -i 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' "$GRADLE"
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 24/g' "$GRADLE"
            sed -i 's/versionCode = flutter\.versionCode.*/versionCode = 1/g' "$GRADLE"
            sed -i 's/versionName = flutter\.versionName.*/versionName = "1.0"/g' "$GRADLE"
            echo "Patched: $GRADLE"
          done

      # ── Native setup ───────────────────────────────────────────────────────
      - name: Setup NDK & CMake
        if: env.PROJECT_TYPE == 'native' || env.PROJECT_TYPE == 'syncxxx'
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}" -name "sdkmanager" | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "y" | "$SDKMANAGER" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Patch Native build.gradle
        if: env.PROJECT_TYPE == 'native' || env.PROJECT_TYPE == 'syncxxx'
        run: |
          GRADLE_ROOT="${BUILD_DIR}/project"
          [ "${{ env.PROJECT_TYPE }}" = "syncxxx" ] && GRADLE_ROOT="${BUILD_DIR}/project/android"

          find "$GRADLE_ROOT" \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            | while read GRADLE; do
              sed -i 's/compileSdkVersion\s*[0-9]*/compileSdkVersion 34/g' "$GRADLE"
              sed -i 's/compileSdk\s*=\s*[0-9]*/compileSdk = 34/g' "$GRADLE"
              sed -i 's/targetSdkVersion\s*[0-9]*/targetSdkVersion 34/g' "$GRADLE"
              sed -i 's/targetSdk\s*=\s*[0-9]*/targetSdk = 34/g' "$GRADLE"
              sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 24/g' "$GRADLE"
              sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 24/g' "$GRADLE"
              echo "Patched: $GRADLE"
            done

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build SyncXxX APK
        if: env.PROJECT_TYPE == 'syncxxx'
        working-directory: ${{ env.BUILD_DIR }}/project/android
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Build Native APK
        if: env.PROJECT_TYPE == 'native'
        run: |
          PROJECT="${BUILD_DIR}/project"

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "⚙️ gradlew tidak ada, generate wrapper..."
            cd "$PROJECT"
            mkdir -p gradle/wrapper

            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

            printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' \
              > gradle/wrapper/gradle-wrapper.properties

            curl -fsSL -o gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew"
            chmod +x gradlew
          fi

          GRADLEW=$(find "$PROJECT" -name "gradlew" | head -1)
          GRADLE_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$GRADLE_DIR"

          echo "✅ Build dari: $GRADLE_DIR"

          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # ── Collect & upload ───────────────────────────────────────────────────
      - name: Collect APKs
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="latest"
          OUT="${BUILD_DIR}/output"
          mkdir -p "$OUT"
          FOUND=0

          if [ "${{ env.PROJECT_TYPE }}" = "syncxxx" ]; then
            APK=$(find "${BUILD_DIR}/project/android/app/build/outputs/apk" \
              -name "*.apk" | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" "$OUT/SyncXxX.apk"
              echo "Collected: SyncXxX.apk"
              FOUND=1
            fi
          else
            while IFS= read -r APK; do
              [ -f "$APK" ] || continue
              BASENAME=$(basename "$APK" .apk)
              cp "$APK" "$OUT/${BASENAME}-${TAG}.apk"
              echo "Collected: ${BASENAME}-${TAG}.apk"
              FOUND=1
            done < <(find "${BUILD_DIR}/project" -name "*.apk" 2>/dev/null)
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "❌ ERROR: Tidak ada APK ditemukan. Isi build dir:"
            find "${BUILD_DIR}/project" -type f | head -50
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag || 'latest' }}-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/output/*.apk
          if-no-files-found: error
          retention-days: 30
