name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        default: ""
      tag:
        description: "Tag release"
        required: false
        default: ""
      build_type:
        description: "debug atau release"
        required: false
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download source ZIP
        run: |
          set -e
          URL="${{ github.event.inputs.zip_url }}"
          echo "Downloading: $URL"
          curl -L -o project.zip "$URL"
          if [ ! -s project.zip ]; then
            echo "File ZIP kosong atau download gagal"
            exit 1
          fi
          mkdir -p project
          unzip -q project.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml 2>/dev/null | head -1 | xargs dirname)
            if [ -n "$DIR" ]; then cp -a "$DIR"/. project/; fi
          fi
          test -f project/pubspec.yaml || { echo "pubspec.yaml tidak ditemukan"; exit 1; }

      - name: Detect Flutter version from pubspec
        id: detect_flutter
        working-directory: project
        run: |
          SDK=$(grep -E '^\s*sdk:' pubspec.yaml | grep -o '[0-9]\+\.[0-9]\+\.[0-9]*' | head -1)
          if [ -z "$SDK" ]; then
            SDK="3.24.5"
          fi
          echo "Detected SDK constraint: $SDK"
          # Map sdk dart version ke flutter version
          MAJOR=$(echo $SDK | cut -d. -f1)
          MINOR=$(echo $SDK | cut -d. -f2)
          if [ "$MINOR" -ge "8" ]; then
            FLUTTER_VER="3.32.0"
          elif [ "$MINOR" -ge "6" ]; then
            FLUTTER_VER="3.27.1"
          elif [ "$MINOR" -ge "5" ]; then
            FLUTTER_VER="3.24.5"
          else
            FLUTTER_VER="3.24.5"
          fi
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "Using Flutter: $FLUTTER_VER"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect_flutter.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            project/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
