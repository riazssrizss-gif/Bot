name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Tag release'
        required: true
        type: string
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o project.zip \
            "${{ github.event.inputs.zip_url }}"
          unzip -q project.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml | head -1 | xargs dirname)
            if [ -n "$DIR" ]; then
              mv "$DIR"/* project/ 2>/dev/null || true
              mv "$DIR"/.* project/ 2>/dev/null || true
            fi
          fi

      - name: Get dependencies
        working-directory: project
        run: |
          sed -i 's/flutter_lints:.*$/flutter_lints: ^4.0.0/' pubspec.yaml
          flutter pub get

      - name: Fix flutter packages
        run: |
          # Patch .pub-cache — naikan minSdk ke 24 biar kompatibel flutter_tts dll
          find ~/.pub-cache -name "build.gradle" | xargs grep -l "flutter\.\(compileSdkVersion\|targetSdkVersion\|minSdkVersion\)" | while read FILE; do
            sed -i 's/flutter\.compileSdkVersion/34/g' "$FILE"
            sed -i 's/flutter\.targetSdkVersion/34/g' "$FILE"
            sed -i 's/flutter\.minSdkVersion/21/g' "$FILE"
            echo "Patched pub-cache: $FILE"
          done

      - name: Fix project build.gradle minSdk
        working-directory: project
        run: |
          # Patch build.gradle (Groovy)
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            # Kalau ada baris minSdkVersion eksplisit → ganti
            if grep -q "minSdkVersion" "$GRADLE"; then
              sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 24/' "$GRADLE"
            else
              # Kalau pakai flutter.minSdkVersion → override
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/' "$GRADLE"
            fi
            echo "Patched: $GRADLE"
          fi

          # Patch build.gradle.kts (Kotlin DSL)
          GRADLE_KTS="android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/' "$GRADLE_KTS"
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 24/' "$GRADLE_KTS"
            sed -i 's/versionCode = flutter\.versionCode.*/versionCode = 1/' "$GRADLE_KTS"
            sed -i 's/versionName = flutter\.versionName.*/versionName = "1.0"/' "$GRADLE_KTS"
            echo "Patched: $GRADLE_KTS"
          fi

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            project/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
