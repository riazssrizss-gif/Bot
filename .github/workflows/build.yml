name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        default: ""
      tag:
        description: "Tag release"
        required: false
        default: ""
      build_type:
        description: "debug atau release"
        required: false
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Download source ZIP
        run: |
          set -e
          URL="${{ github.event.inputs.zip_url }}"
          curl -L -o project.zip "$URL"
          if [ ! -s project.zip ]; then exit 1; fi
          mkdir -p project
          unzip -q project.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml 2>/dev/null | head -1 | xargs dirname)
            if [ -n "$DIR" ]; then cp -a "$DIR"/. project/; fi
          fi
          test -f project/pubspec.yaml

      - name: Relax SDK constraint
        working-directory: project
        run: |
          sed -i 's/sdk: "\^[0-9.]*"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          sed -i "s/sdk: '\^[0-9.]*'/sdk: '>=3.0.0 <4.0.0'/g" pubspec.yaml
          sed -i 's/sdk: \^[0-9.]*/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml

      - name: Fix Gradle and AGP
        run: |
          FILE=$(find project -name "gradle-wrapper.properties" 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            sed -i 's|distributions/gradle-[^/]*|distributions/gradle-8.14.5-bin|g' "$FILE"
            echo "gradle-wrapper.properties:"
            cat "$FILE"
          fi
          for F in $(find project -name "settings.gradle" -o -name "build.gradle" 2>/dev/null); do
            sed -i 's|com.android.tools.build:gradle:[0-9.]*|com.android.tools.build:gradle:8.3.0|g' "$F"
          done

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            project/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
