# .github/workflows/build.yml

name: Flutter & Native Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project'
        required: true
        type: string

      tag:
        description: 'Tag release'
        required: true
        type: string

      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_DIR: ${{ github.workspace }}/build_${{ github.run_id }}
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_TAG: ${{ inputs.tag }}

    steps:

      # ==========================================
      # 1. JAVA SETUP
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 2. BUILD DIRECTORY
      # ==========================================

      - name: Set build directory
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$BUILD_DIR/project"
          mkdir -p "$BUILD_DIR/output"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 3. DOWNLOAD PROJECT ZIP
      # ==========================================

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ inputs.zip_url }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Downloading project ZIP..."

          curl -fL --retry 3 \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "$BUILD_DIR/project.zip" \
            "$ZIP_URL"

          echo "Checking ZIP integrity..."

          unzip -t "$BUILD_DIR/project.zip"

          unzip -oq "$BUILD_DIR/project.zip" \
            -d "$BUILD_DIR/project"

          echo "ZIP successfully extracted."

      # ==========================================
      # 4. DETECT PROJECT TYPE & ROOT
      # ==========================================

      - name: Detect project type & root
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="$BUILD_DIR/project"

          echo "=================================="
          echo "SCANNING PROJECT"
          echo "=================================="

          # Flutter
          PUBSPEC=$(find "$PROJECT" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            -not -path "*/node_modules/*" \
            -print -quit)

          if [ -n "$PUBSPEC" ]; then

            ROOT=$(dirname "$PUBSPEC")
            TYPE="flutter"

          else

            # Native Android
            SETTINGS=$(find "$PROJECT" \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -not -path "*/node_modules/*" \
              -print -quit)

            if [ -n "$SETTINGS" ]; then

              ROOT=$(dirname "$SETTINGS")
              TYPE="native"

            else

              # Node.js
              PKG=$(find "$PROJECT" \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -not -path "*/.git/*" \
                -print -quit)

              if [ -n "$PKG" ]; then

                ROOT=$(dirname "$PKG")
                TYPE="node"

              else

                echo "ERROR: Project configuration not found"

                echo "Project files:"
                find "$PROJECT" -maxdepth 7 -type f | head -150

                exit 1

              fi
            fi
          fi

          echo "PROJECT_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

          echo "=================================="
          echo "PROJECT TYPE: $TYPE"
          echo "PROJECT ROOT: $ROOT"
          echo "=================================="

          ls -la "$ROOT"

      # ==========================================
      # 5. FLUTTER SETUP
      # ==========================================

      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Get Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter --version
          flutter pub get

      # ==========================================
      # 6. FLUTTER BUILD
      # ==========================================

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter doctor -v

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk --debug

          else

            flutter build apk --release

          fi

      # ==========================================
      # 7. NATIVE ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        if: env.PROJECT_TYPE == 'native'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # ==========================================
      # 8. INSTALL GRADLE DIRECTLY
      # ==========================================

      - name: Setup Gradle Native
        if: env.PROJECT_TYPE == 'native'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          GRADLE_VERSION="8.9"

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER_FILE" ]; then

            DISTRIBUTION_URL=$(grep '^distributionUrl=' \
              "$WRAPPER_FILE" | head -1 | cut -d= -f2-)

            DETECTED_VERSION=$(echo "$DISTRIBUTION_URL" \
              | grep -oE 'gradle-[0-9]+(\.[0-9]+)*' \
              | head -1 \
              | sed 's/gradle-//')

            if [ -n "$DETECTED_VERSION" ]; then
              GRADLE_VERSION="$DETECTED_VERSION"
            fi

          fi

          echo "Gradle version: $GRADLE_VERSION"

          INSTALL_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          mkdir -p "$INSTALL_DIR"

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$INSTALL_DIR"

          GRADLE_HOME="$INSTALL_DIR/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            echo "ERROR: Gradle executable missing"
            exit 1
          fi

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          echo "GRADLE_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"

          "$GRADLE_HOME/bin/gradle" --version

      # ==========================================
      # 9. BUILD NATIVE ANDROID APK
      # ==========================================

      - name: Build Native APK
        if: env.PROJECT_TYPE == 'native'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================="
          echo "NATIVE ANDROID BUILD"
          echo "=================================="

          echo "Project directory:"
          pwd

          echo "Gradle:"
          gradle --version

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle missing"
            exit 1

          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then

            echo "ERROR: Root build.gradle missing"
            exit 1

          fi

          if [ ! -d "app" ]; then
            echo "ERROR: Android app module missing"
            exit 1
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then

            gradle assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle assembleRelease \
              --no-daemon \
              --stacktrace

          fi

          echo "Native build process completed."

      # ==========================================
      # 10. NODE SETUP
      # ==========================================

      - name: Setup Node.js
        if: env.PROJECT_TYPE == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Node.js
        if: env.PROJECT_TYPE == 'node'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then

            npm run build

          else

            echo "No build script found. Skipping build."

          fi

      # ==========================================
      # 11. PACKAGE NODE
      # ==========================================

      - name: Package Node.js artifact
        if: env.PROJECT_TYPE == 'node'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$BUILD_DIR/output"

          zip -r \
            "$BUILD_DIR/output/node-${BUILD_TAG}.zip" \
            . \
            -x "*.git*" \
            -x "node_modules/*"

      # ==========================================
      # 12. COLLECT APK
      # ==========================================

      - name: Collect APKs
        if: env.PROJECT_TYPE != 'node'
        shell: bash
        run: |
          set -Eeuo pipefail

          OUT="$BUILD_DIR/output"

          mkdir -p "$OUT"

          FOUND=0

          echo "Searching APK files..."

          while IFS= read -r -d '' APK; do

            BASENAME=$(basename "$APK" .apk)

            cp "$APK" \
              "$OUT/${BASENAME}-${BUILD_TAG}.apk"

            echo "Collected: ${BASENAME}-${BUILD_TAG}.apk"

            FOUND=1

          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -not -path "*/.gradle/*" \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then

            echo "ERROR: APK not found"

            echo "Build output directories:"
            find "$PROJECT_DIR" \
              -type d \
              -path "*/outputs/*" | head -100

            exit 1

          fi

          echo "APK collection completed."

      # ==========================================
      # 13. UPLOAD APK ARTIFACT
      # ==========================================

      - name: Upload APK artifact
        if: env.PROJECT_TYPE != 'node'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/output/*.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # 14. UPLOAD NODE ARTIFACT
      # ==========================================

      - name: Upload Node.js artifact
        if: env.PROJECT_TYPE == 'node'
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ inputs.tag }}-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/output/node-${{ inputs.tag }}.zip
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # 15. BUILD SUMMARY
      # ==========================================

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "=================================="
          echo "BUILD SUCCESS"
          echo "=================================="

          echo "Project: $PROJECT_TYPE"
          echo "Build type: $BUILD_TYPE"
          echo "Tag: $BUILD_TAG"

          echo "=================================="
          echo "OUTPUT FILES"
          echo "=================================="

          ls -lh "$BUILD_DIR/output"
