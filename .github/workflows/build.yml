name: Flutter & Native Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project'
        required: true
        type: string
      tag:
        description: 'Tag release'
        required: true
        type: string
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # BUILD DIRECTORY
      # ==========================================

      - name: Set build dir
        shell: bash
        run: |
          set -Eeuo pipefail

          BUILD_DIR="${GITHUB_WORKSPACE}/build_${GITHUB_RUN_ID}"

          echo "BUILD_DIR=${BUILD_DIR}" >> "$GITHUB_ENV"

          mkdir -p "$BUILD_DIR/project"
          mkdir -p "$BUILD_DIR/output"

      # ==========================================
      # DOWNLOAD ZIP
      # ==========================================

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="${BUILD_DIR}/project"

          echo "Downloading project..."

          curl -fL --retry 3 \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "${BUILD_DIR}/project.zip" \
            "${{ github.event.inputs.zip_url }}"

          echo "Checking ZIP integrity..."

          unzip -t "${BUILD_DIR}/project.zip"

          unzip -oq "${BUILD_DIR}/project.zip" \
            -d "$PROJECT"

          echo "ZIP extracted successfully"

      # ==========================================
      # DETECT PROJECT
      # ==========================================

      - name: Detect project type & root
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="${BUILD_DIR}/project"

          echo "================================"
          echo "SCANNING PROJECT"
          echo "================================"

          # Flutter detection
          PUBSPEC=$(find "$PROJECT" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            -print -quit)

          if [ -n "$PUBSPEC" ]; then

            ROOT=$(dirname "$PUBSPEC")
            TYPE="flutter"

          else

            # Native Android detection
            SETTINGS=$(find "$PROJECT" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -not -path "*/node_modules/*" \
              -print -quit)

            if [ -n "$SETTINGS" ]; then

              ROOT=$(dirname "$SETTINGS")
              TYPE="native"

              GRADLEW=$(find "$PROJECT" \
                -type f \
                -name "gradlew" \
                -not -path "*/.gradle/*" \
                -not -path "*/node_modules/*" \
                -print -quit)

              if [ -z "$GRADLEW" ]; then
                echo "ERROR: gradlew tidak ditemukan"
                find "$PROJECT" -maxdepth 5 -type f | head -100
                exit 1
              fi

              echo "GRADLEW_PATH=${GRADLEW}" >> "$GITHUB_ENV"

            else

              # Node.js detection
              PKG=$(find "$PROJECT" \
                -type f \
                -name "package.json" \
                -not -path "*/node_modules/*" \
                -not -path "*/.git/*" \
                -print -quit)

              if [ -n "$PKG" ]; then

                ROOT=$(dirname "$PKG")
                TYPE="node"

              else

                echo "ERROR: Project configuration not found"

                echo "ZIP contents:"
                unzip -Z1 "${BUILD_DIR}/project.zip" | head -100

                echo "Extracted files:"
                find "$PROJECT" -maxdepth 6 -type f | head -150

                exit 1

              fi
            fi
          fi

          echo "PROJECT_TYPE=${TYPE}" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=${ROOT}" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT TYPE: ${TYPE}"
          echo "PROJECT ROOT: ${ROOT}"
          echo "================================"

          ls -la "$ROOT"

      # ==========================================
      # FLUTTER SETUP
      # ==========================================

      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Get Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter --version
          flutter pub get

      # ==========================================
      # FLUTTER MIN SDK
      # ==========================================

      - name: Fix project minSdk (Flutter)
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          for GRADLE in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$GRADLE" ] || continue

            echo "Checking $GRADLE"

            sed -i \
              's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' \
              "$GRADLE"

          done

      # ==========================================
      # NATIVE ANDROID SETUP
      # ==========================================

      - name: Setup NDK & CMake
        if: env.PROJECT_TYPE == 'native'
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f -name sdkmanager -print -quit)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # ==========================================
      # NODE SETUP
      # ==========================================

      - name: Setup Node.js
        if: env.PROJECT_TYPE == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Node.js
        if: env.PROJECT_TYPE == 'node'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi

      # ==========================================
      # BUILD FLUTTER APK
      # ==========================================

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter doctor -v

          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      # ==========================================
      # BUILD NATIVE APK
      # ==========================================

      - name: Build Native APK
        if: env.PROJECT_TYPE == 'native'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "================================"
          echo "NATIVE ANDROID BUILD"
          echo "================================"

          echo "Project: $(pwd)"
          echo "Gradle wrapper: ${GRADLEW_PATH}"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          if [ ! -f "$GRADLEW_PATH" ]; then
            echo "ERROR: Gradle wrapper tidak ditemukan"
            exit 1
          fi

          chmod +x "$GRADLEW_PATH"

          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then

            "$GRADLEW_PATH" \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            "$GRADLEW_PATH" \
              assembleRelease \
              --no-daemon \
              --stacktrace

          fi

      # ==========================================
      # PACKAGE NODE
      # ==========================================

      - name: Package Node.js artifact
        if: env.PROJECT_TYPE == 'node'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="${{ github.event.inputs.tag }}"
          OUT="${BUILD_DIR}/output"

          mkdir -p "$OUT"

          zip -r "$OUT/node-${TAG}.zip" . \
            -x "*.git*" \
            -x "node_modules/*"

      # ==========================================
      # COLLECT APK
      # ==========================================

      - name: Collect APKs
        if: env.PROJECT_TYPE != 'node'
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="${{ github.event.inputs.tag }}"
          OUT="${BUILD_DIR}/output"

          mkdir -p "$OUT"

          FOUND=0

          while IFS= read -r -d '' APK; do

            BASENAME=$(basename "$APK" .apk)

            cp "$APK" "$OUT/${BASENAME}-${TAG}.apk"

            echo "Collected: ${BASENAME}-${TAG}.apk"

            FOUND=1

          done < <(
            find "${PROJECT_DIR}" \
              -type f \
              -name "*.apk" \
              -not -path "*/.gradle/*" \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then

            echo "ERROR: Tidak ada APK ditemukan"

            find "${PROJECT_DIR}" \
              -maxdepth 7 \
              -type f | head -100

            exit 1

          fi

      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK artifact
        if: env.PROJECT_TYPE != 'node'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/output/*.apk
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # UPLOAD NODE
      # ==========================================

      - name: Upload Node.js artifact
        if: env.PROJECT_TYPE == 'node'
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ github.event.inputs.tag }}-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/output/node-${{ github.event.inputs.tag }}.zip
          if-no-files-found: error
          retention-days: 7
