name: Build APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'native atau flutter'
        required: true
        default: 'flutter'
        type: choice
        options:
          - native
          - flutter
      zip_url:
        description: 'URL ZIP project Flutter (isi kalau mode=flutter)'
        required: false
        type: string
      tag:
        description: 'Tag release'
        required: false
        default: 'build'
        type: string
      build_type:
        description: 'debug atau release'
        required: false
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── NATIVE ──────────────────────────────────────────
      - name: Make gradlew executable (native)
        if: github.event.inputs.mode == 'native'
        run: chmod +x android/gradlew

      - name: Build Native APK
        if: github.event.inputs.mode == 'native'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Native APK
        if: github.event.inputs.mode == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: remote-controller-native
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      # ── FLUTTER ─────────────────────────────────────────
      - name: Setup Flutter
        if: github.event.inputs.mode == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Download & extract Flutter ZIP
        if: github.event.inputs.mode == 'flutter'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build_dir/project
          curl -fsSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o build_dir/project.zip \
            "${{ github.event.inputs.zip_url }}"
          unzip -q build_dir/project.zip -d build_dir/project
          if [ ! -f build_dir/project/pubspec.yaml ]; then
            DIR=$(find build_dir/project -name "pubspec.yaml" | head -1 | xargs dirname)
            [ -n "$DIR" ] && mv "$DIR"/* build_dir/project/ 2>/dev/null || true
          fi

      - name: Flutter pub get
        if: github.event.inputs.mode == 'flutter'
        working-directory: build_dir/project
        run: |
          sed -i 's/flutter_lints:.*$/flutter_lints: ^4.0.0/' pubspec.yaml
          flutter pub get || flutter pub upgrade --major-versions

      - name: Fix minSdk
        if: github.event.inputs.mode == 'flutter'
        working-directory: build_dir/project
        run: |
          GRADLE="android/app/build.gradle"
          [ -f "$GRADLE" ] && sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 24/' "$GRADLE"
          GRADLE_KTS="android/app/build.gradle.kts"
          [ -f "$GRADLE_KTS" ] && sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 24/' "$GRADLE_KTS"

      - name: Build Flutter APK
        if: github.event.inputs.mode == 'flutter'
        working-directory: build_dir/project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Rename Flutter APK
        if: github.event.inputs.mode == 'flutter'
        run: |
          APK_DIR="build_dir/project/build/app/outputs/flutter-apk"
          TAG="${{ github.event.inputs.tag }}"
          for APK in "$APK_DIR"/*.apk; do
            [ -f "$APK" ] || continue
            BASENAME=$(basename "$APK" .apk)
            mv "$APK" "$APK_DIR/${BASENAME}-${TAG}.apk"
          done

      - name: Upload Flutter APK
        if: github.event.inputs.mode == 'flutter'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ github.event.inputs.tag }}-${{ github.run_id }}
          path: |
            build_dir/project/build/app/outputs/flutter-apk/*.apk
            build_dir/project/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
