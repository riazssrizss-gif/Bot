# .github/workflows/build.yml
name: Flutter & Native Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project'
        required: true
        type: string
      tag:
        description: 'Tag release'
        required: true
        type: string
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set build dir
        run: |
          BUILD_DIR="${GITHUB_WORKSPACE}/build_${{ github.run_id }}"
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          mkdir -p "${BUILD_DIR}"

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "${BUILD_DIR}/project.zip" \
            "${{ github.event.inputs.zip_url }}"

          unzip -q "${BUILD_DIR}/project.zip" -d "${BUILD_DIR}/project"

      - name: Detect project type & normalize root
        run: |
          PROJECT="${BUILD_DIR}/project"

          PUBSPEC=$(find "$PROJECT" -name "pubspec.yaml" | head -1)

          if [ -n "$PUBSPEC" ]; then
            echo "PROJECT_TYPE=flutter" >> $GITHUB_ENV
            echo "✅ Detected: Flutter"

            ROOT=$(dirname "$PUBSPEC")
            if [ "$ROOT" != "$PROJECT" ]; then
              shopt -s dotglob
              mv "$ROOT"/* "$PROJECT/" 2>/dev/null || true
              shopt -u dotglob
            fi

          else
            SETTINGS=$(find "$PROJECT" \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -1)

            if [ -n "$SETTINGS" ]; then
              echo "PROJECT_TYPE=native" >> $GITHUB_ENV
              echo "✅ Detected: Native Android"

              ROOT=$(dirname "$SETTINGS")
              if [ "$ROOT" != "$PROJECT" ]; then
                shopt -s dotglob
                mv "$ROOT"/* "$PROJECT/" 2>/dev/null || true
                shopt -u dotglob
              fi
            else
              echo "❌ ERROR: Tidak ditemukan pubspec.yaml maupun settings.gradle"
              find "$PROJECT" -type f | head -40
              exit 1
            fi
          fi

      # ── Flutter setup ──────────────────────────────────────────────────────
      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Get Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          sed -i 's/flutter_lints:.*$/flutter_lints: ^4.0.0/' pubspec.yaml
          flutter pub get || flutter pub upgrade --major-versions

      - name: Fix pub-cache build.gradle
        if: env.PROJECT_TYPE == 'flutter'
        run: |
          find ~/.pub-cache -name "build.gradle" \
            | xargs grep -l "flutter\.\(compileSdkVersion\|targetSdkVersion\|minSdkVersion\)" 2>/dev/null \
            | while read FILE; do
              sed -i 's/flutter\.compileSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.targetSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.minSdkVersion/21/g' "$FILE"
              echo "Patched: $FILE"
            done

      - name: Fix project minSdk (Flutter)
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          for GRADLE in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$GRADLE" ] || continue
            sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 24/g' "$GRADLE"
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/g' "$GRADLE"
            sed -i 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' "$GRADLE"
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 24/g' "$GRADLE"
            sed -i 's/versionCode = flutter\.versionCode.*/versionCode = 1/g' "$GRADLE"
            sed -i 's/versionName = flutter\.versionName.*/versionName = "1.0"/g' "$GRADLE"
            echo "Patched: $GRADLE"
          done

      # ── Native setup ───────────────────────────────────────────────────────
      - name: Setup NDK & CMake
        if: env.PROJECT_TYPE == 'native'
        run: |
          echo "y" | sdkmanager \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            --sdk_root="${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Patch Native build.gradle
        if: env.PROJECT_TYPE == 'native'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          find . \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            | while read GRADLE; do
              sed -i 's/compileSdkVersion\s*[0-9]*/compileSdkVersion 34/g' "$GRADLE"
              sed -i 's/compileSdk\s*=\s*[0-9]*/compileSdk = 34/g' "$GRADLE"
              sed -i 's/targetSdkVersion\s*[0-9]*/targetSdkVersion 34/g' "$GRADLE"
              sed -i 's/targetSdk\s*=\s*[0-9]*/targetSdk = 34/g' "$GRADLE"
              sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 24/g' "$GRADLE"
              sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 24/g' "$GRADLE"
              echo "Patched: $GRADLE"
            done

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Build Native APK
        if: env.PROJECT_TYPE == 'native'
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # ── Collect & upload ───────────────────────────────────────────────────
      - name: Collect APKs
        run: |
          TAG="${{ github.event.inputs.tag }}"
          OUT="${BUILD_DIR}/output"
          mkdir -p "$OUT"
          FOUND=0

          while IFS= read -r APK; do
            [ -f "$APK" ] || continue
            BASENAME=$(basename "$APK" .apk)
            cp "$APK" "$OUT/${BASENAME}-${TAG}.apk"
            echo "Collected: ${BASENAME}-${TAG}.apk"
            FOUND=1
          done < <(find "${BUILD_DIR}/project" -name "*.apk" 2>/dev/null)

          if [ "$FOUND" -eq 0 ]; then
            echo "❌ ERROR: Tidak ada APK ditemukan. Isi build dir:"
            find "${BUILD_DIR}/project" -type f | head -50
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/output/*.apk
          if-no-files-found: error
          retention-days: 7
