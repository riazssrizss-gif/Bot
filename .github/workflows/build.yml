name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        default: ""
      tag:
        description: "Tag release"
        required: false
        default: ""
      build_type:
        description: "debug atau release"
        required: false
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Download source ZIP
        run: |
          set -e
          URL="${{ github.event.inputs.zip_url }}"
          curl -L -o project.zip "$URL"
          if [ ! -s project.zip ]; then exit 1; fi
          mkdir -p project
          unzip -q project.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml 2>/dev/null | head -1 | xargs dirname)
            if [ -n "$DIR" ]; then cp -a "$DIR"/. project/; fi
          fi
          test -f project/pubspec.yaml

      - name: Relax SDK constraint
        working-directory: project
        run: |
          sed -i 's/sdk: "\^[0-9.]*"/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml
          sed -i "s/sdk: '\^[0-9.]*'/sdk: '>=3.0.0 <4.0.0'/g" pubspec.yaml
          sed -i 's/sdk: \^[0-9.]*/sdk: ">=3.0.0 <4.0.0"/g' pubspec.yaml

      - name: Fix Gradle wrapper
        run: |
          FILE=$(find project -name "gradle-wrapper.properties" 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.12-all.zip|g' "$FILE"
            cat "$FILE"
          fi

      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || true

      - name: Create dummy google-services.json
        run: |
          APP_DIR=$(find project -path "*/android/app" -type d 2>/dev/null | head -1)
          PKG=$(grep -r "applicationId" project/android/app/build.gradle.kts 2>/dev/null | grep -o '"[^"]*"' | tr -d '"' | head -1)
          if [ -z "$PKG" ]; then PKG="com.example.app"; fi
          echo "Package: $PKG"
          if [ -n "$APP_DIR" ] && [ ! -f "$APP_DIR/google-services.json" ]; then
            echo "{\"project_info\":{\"project_number\":\"000000000000\",\"project_id\":\"dummy-project\",\"storage_bucket\":\"dummy-project.appspot.com\"},\"client\":[{\"client_info\":{\"mobilesdk_app_id\":\"1:000000000000:android:0000000000000000\",\"android_client_info\":{\"package_name\":\"$PKG\"}},\"oauth_client\":[],\"api_key\":[{\"current_key\":\"dummy\"}],\"services\":{\"appinvite_service\":{\"other_platform_oauth_client\":[]}}}],\"configuration_version\":\"1\"}" > "$APP_DIR/google-services.json"
            echo "Created google-services.json for $PKG"
          fi

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug --verbose 2>&1 | tail -100
          else
            flutter build apk --release --verbose 2>&1 | tail -100
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: project/build/app/outputs/**/*.apk
          if-no-files-found: error
