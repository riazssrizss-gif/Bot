name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Tag release'
        required: true
        type: string
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'   # Dart 3.8.2 — support syntax_phantom ^3.8.1
          channel: 'stable'

      - name: Set build dir
        run: |
          BUILD_DIR="${GITHUB_WORKSPACE}/build_${{ github.run_id }}"
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          mkdir -p "${BUILD_DIR}"

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o "${BUILD_DIR}/project.zip" \
            "${{ github.event.inputs.zip_url }}"

          unzip -q "${BUILD_DIR}/project.zip" -d "${BUILD_DIR}/project"

          if [ ! -f "${BUILD_DIR}/project/pubspec.yaml" ]; then
            DIR=$(find "${BUILD_DIR}/project" -name "pubspec.yaml" | head -1 | xargs dirname)
            if [ -n "$DIR" ]; then
              shopt -s dotglob
              mv "$DIR"/* "${BUILD_DIR}/project/" 2>/dev/null || true
              shopt -u dotglob
            fi
          fi

      - name: Get dependencies
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          # Hapus constraint flutter_lints & syntax_phantom biar resolved otomatis
          sed -i 's/flutter_lints:.*$/flutter_lints: ^4.0.0/' pubspec.yaml
          sed -i '/syntax_phantom:/d' pubspec.yaml

          flutter pub get || flutter pub upgrade --major-versions

      - name: Fix pub-cache build.gradle
        run: |
          find ~/.pub-cache -name "build.gradle" \
            | xargs grep -l "flutter\.\(compileSdkVersion\|targetSdkVersion\|minSdkVersion\)" 2>/dev/null \
            | while read FILE; do
              sed -i 's/flutter\.compileSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.targetSdkVersion/34/g' "$FILE"
              sed -i 's/flutter\.minSdkVersion/21/g' "$FILE"
              echo "Patched pub-cache: $FILE"
            done

      - name: Fix project minSdk
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            if grep -q "minSdkVersion" "$GRADLE"; then
              sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 24/' "$GRADLE"
            else
              sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/' "$GRADLE"
            fi
            echo "Patched: $GRADLE"
          fi

          GRADLE_KTS="android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/' "$GRADLE_KTS"
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 24/' "$GRADLE_KTS"
            sed -i 's/versionCode = flutter\.versionCode.*/versionCode = 1/' "$GRADLE_KTS"
            sed -i 's/versionName = flutter\.versionName.*/versionName = "1.0"/' "$GRADLE_KTS"
            echo "Patched: $GRADLE_KTS"
          fi

      - name: Build APK
        working-directory: ${{ env.BUILD_DIR }}/project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Rename APK with tag
        run: |
          APK_DIR="${BUILD_DIR}/project/build/app/outputs/flutter-apk"
          TAG="${{ github.event.inputs.tag }}"
          for APK in "$APK_DIR"/*.apk; do
            [ -f "$APK" ] || continue
            BASENAME=$(basename "$APK" .apk)
            mv "$APK" "$APK_DIR/${BASENAME}-${TAG}.apk"
            echo "Renamed: ${BASENAME}-${TAG}.apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}-${{ github.run_id }}
          path: |
            ${{ env.BUILD_DIR }}/project/build/app/outputs/flutter-apk/*.apk
            ${{ env.BUILD_DIR }}/project/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
