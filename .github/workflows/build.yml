name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Tag release'
        required: true
        type: string
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o project.zip \
            "${{ github.event.inputs.zip_url }}"
          unzip -q project.zip -d project
          if [ ! -f project/pubspec.yaml ]; then
            DIR=$(find project -name pubspec.yaml | head -1 | xargs dirname)
            if [ -n "$DIR" ]; then
              mv "$DIR"/* project/ 2>/dev/null || true
              mv "$DIR"/.* project/ 2>/dev/null || true
            fi
          fi

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Fix flutter packages
        run: |
          find ~/.pub-cache -name "build.gradle" | xargs grep -l "flutter\.\(compileSdkVersion\|targetSdkVersion\|minSdkVersion\)" | while read FILE; do
            sed -i 's/flutter\.compileSdkVersion/34/g' "$FILE"
            sed -i 's/flutter\.targetSdkVersion/34/g' "$FILE"
            sed -i 's/flutter\.minSdkVersion/21/g' "$FILE"
            echo "Patched: $FILE"
          done

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: |
            project/build/app/outputs/flutter-apk/*.apk
            project/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
